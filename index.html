const SHOW=[["cGrid","grid"],["cCoord","coord"],["cNotes","notes"],["cMono","mono"]];
SHOW.forEach(([id,k])=>{
  const el=document.getElementById(id);
  el.onchange=()=>{ S[k]=el.checked; refresh(); store(); };
});

document.getElementById("clear").onclick=()=>{ push(); blank(); closeInspector(); refresh(); store(); };
document.getElementById("undo").onclick=undo;
document.getElementById("redo").onclick=redo;

/* ══════════════ export, print, files ══════════════ */
function slug(){
  return (S.title||"hex-plate").toLowerCase().replace(/[^a-z0-9]+/g,"-")
         .replace(/^-|-$/g,"")||"hex-plate";
}
function dl(href,name){ const a=document.createElement("a"); a.href=href; a.download=name; a.click(); }
document.getElementById("png").onclick=()=>{
  const L=layout();
  const off=document.createElement("canvas");
  off.width=Math.round(L.pw*DPMM_PRINT); off.height=Math.round(L.ph*DPMM_PRINT);
  paint(off.getContext("2d"),DPMM_PRINT,L);
  dl(off.toDataURL("image/png"), slug()+"-a4-300dpi.png");
};
document.getElementById("print").onclick=()=>window.print();
window.addEventListener("beforeprint",()=>{ printing=true; refresh(); });
window.addEventListener("afterprint",()=>{ printing=false; refresh(); });

function serialise(){
  return JSON.stringify({
    v:8, cols:S.cols, rows:S.rows,
    title:S.title,
    show:{grid:S.grid,coord:S.coord,notes:S.notes,mono:S.mono},
    custom:S.custom, paths:(S.paths||[]),
    tiles:TERRAINS.map(t=>t.id), feats:FEATURES.map(f=>f.id),
    terr:Array.from(S.terr), feat:Array.from(S.feat), labels:S.labels, memo:S.memo
  });
}
function hydrate(d){
  if(!d||!d.cols) throw new Error("not a hex plate");
  S.cols=Math.max(4,Math.min(40,d.cols|0));
  S.rows=Math.max(4,Math.min(40,d.rows|0));
  S.title=d.title||"";
  S.custom=Array.isArray(d.custom) ? d.custom.filter(t=>t&&t.id&&t.base).slice(0,30) : [];
  S.paths=Array.isArray(d.paths) ? d.paths.filter(p=>p&&p.hexes&&p.hexes.length>=2) : [];
  rebuildTiles();
  const n=S.cols*S.rows;
  S.terr=new Uint8Array(n); S.feat=new Uint8Array(n); S.labels={}; S.memo={};
  // remap through the saved id lists, so older plates survive list changes
  const tmap=(d.tiles||[]).map(id=>T_BY_ID[id]||0);
  const fmap=(d.feats||[]).map(id=>F_BY_ID[id]||0);
  (d.terr||[]).slice(0,n).forEach((v,i)=>{
    S.terr[i]= v ? (tmap.length ? (tmap[v-1]||0) : (v<=TERRAINS.length?v:0)) : 0; });
  (d.feat||[]).slice(0,n).forEach((v,i)=>{
    S.feat[i]= v ? (fmap.length ? (fmap[v-1]||0) : (v<=FEATURES.length?v:0)) : 0; });
  for(const k in (d.labels||{})) if(+k<n) S.labels[k]=String(d.labels[k]).slice(0,28);
  for(const k in (d.memo||{}))   if(+k<n) S.memo[k]=String(d.memo[k]).slice(0,1200);
  if(d.show){ S.grid=!!d.show.grid; S.coord=!!d.show.coord;
              S.notes=d.show.notes!==false; S.mono=!!d.show.mono; }
  sel=null;
}
document.getElementById("save").onclick=()=>{
  dl(URL.createObjectURL(new Blob([serialise()],{type:"application/json"})),
     slug()+".hexplate.json");
};
document.getElementById("open").onclick=()=>{
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        push(); hydrate(JSON.parse(rd.result)); syncRail(); closeInspector();
        if(autoFit){ ppmView=fitPpm(); showZoom(); }
        refresh(); store();
        document.getElementById("hint").textContent="Opened "+f.name;
      }catch(err){
        document.getElementById("hint").textContent="That file isn’t a hex plate — expected .hexplate.json";
      }
    };
    rd.readAsText(f);
  };
  inp.click();
};
function syncRail(){
  buildTileSwatches();
  colsI.value=colsO.value=S.cols; rowsI.value=rowsO.value=S.rows;
  document.getElementById("title").value=S.title;

  SHOW.forEach(([id,k])=>{ document.getElementById(id).checked=S[k]; });
  brushO.value=[1,7,19][brush]+" hex"+(brush?"es":"");
  showZoom();
}

/* ══════════════ custom tiles ══════════════ */
const TM_COLORS = ["#58A8D8","#7FCFEA","#86CC72","#4E9E4A","#2A7248","#9CAF6E",
                   "#F5CE94","#D9CB70","#B58A57","#CFE0E8","#B0B6BC","#8E7BA6",
                   "#D98A7B","#E0B0C8","#7BC0B4","#C9C0A8","#A8894F","#6E86A8"];
const tileModal=document.getElementById("tileModal");
let tmColor="#CFE0E8", tmSvg=null, tmSvgName="", tmKeepColour=false;
const TM_PREVIEW_ID="__tmPreview";

function markFor(base){ const L=lum(base); return L>.2 ? shade(base,-.38) : shade(base,.30); }

function drawTileHex(c,w,h,base,mark,svgId,keep){
  c.clearRect(0,0,w,h);
  c.fillStyle=PAPER; c.fillRect(0,0,w,h);
  const s=Math.min(w,h)*.42, cx=w/2, cy=h/2;
  const hex=()=>{ c.beginPath();
    for(let i=0;i<6;i++){ const a=-Math.PI/6+i*Math.PI/3;
      const px=cx+s*Math.cos(a), py=cy+s*Math.sin(a); i?c.lineTo(px,py):c.moveTo(px,py); }
    c.closePath(); };
  c.save(); hex(); c.clip();
  SYM_SQUASH=1; SYM_SHIFT=0;
  c.fillStyle=base; c.fill();
  if(svgId) drawSvgSymbol(c,cx,cy,s,svgId,mark,keep);
  c.restore();
  c.strokeStyle="rgba(46,36,24,.55)"; c.lineWidth=1; hex(); c.stroke();
}
function tmRefresh(){
  const cv2=document.getElementById("tmPreview");
  drawTileHex(cv2.getContext("2d"),cv2.width,cv2.height,
              tmColor,markFor(tmColor), tmSvg?TM_PREVIEW_ID:null, tmKeepColour);
  [...document.getElementById("tmColors").children]
    .forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.col===tmColor)));
  document.getElementById("tmFileName").textContent =
    tmSvgName || "No symbol — a flat colour tile";
  document.getElementById("tmKeepWrap").style.display = tmSvg ? "" : "none";
}
(function buildColourSwatches(){
  const cw=document.getElementById("tmColors");
  TM_COLORS.forEach(col=>{
    const b=document.createElement("button");
    b.type="button"; b.dataset.col=col; b.style.background=col; b.title=col;
    b.onclick=()=>{ tmColor=col; document.getElementById("tmColor").value=col; tmRefresh(); };
    cw.appendChild(b);
  });
})();
document.getElementById("tmColor").oninput=e=>{ tmColor=e.target.value; tmRefresh(); };
document.getElementById("tmKeep").onchange=e=>{ tmKeepColour=e.target.checked; tmRefresh(); };
document.getElementById("tmPick").onclick=()=>document.getElementById("tmFile").click();
document.getElementById("tmDrop").onclick=()=>{
  tmSvg=null; tmSvgName=""; tmKeepColour=false;
  document.getElementById("tmKeep").checked=false;
  document.getElementById("tmFile").value="";
  delete SVG_CACHE[TM_PREVIEW_ID];
  tmRefresh();
};
document.getElementById("tmFile").onchange=e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  const warn=document.getElementById("tmWarn");
  if(f.size>96*1024){ warn.textContent="That SVG is over 96 KB — try a simpler one."; return; }
  const rd=new FileReader();
  rd.onload=()=>{
    let txt=String(rd.result);
    if(txt.indexOf("<svg")<0){ warn.textContent="That file isn't an SVG."; return; }
    txt=txt.replace(/<script[\s\S]*?<\/script>/gi,"");   // inert anyway, dropped for safety
    warn.textContent="";
    tmSvg=txt; tmSvgName=f.name;
    loadTileSvg(TM_PREVIEW_ID, txt, tmRefresh);
  };
  rd.readAsText(f);
};
document.getElementById("tmClose").onclick=()=>tileModal.classList.remove("on");
tileModal.addEventListener("pointerdown",e=>{ if(e.target===tileModal) tileModal.classList.remove("on"); });
document.getElementById("newTile").onclick=()=>{
  document.getElementById("tmName").value="";
  document.getElementById("tmWarn").textContent="";
  document.getElementById("tmFile").value="";
  document.getElementById("tmKeep").checked=false;
  tmColor="#CFE0E8"; tmSvg=null; tmSvgName=""; tmKeepColour=false;
  delete SVG_CACHE[TM_PREVIEW_ID];
  document.getElementById("tmColor").value=tmColor;
  tileModal.classList.add("on");
  tmRefresh();
  document.getElementById("tmName").focus();
};
document.getElementById("tmSave").onclick=()=>{
  const nm=document.getElementById("tmName").value.trim();
  const warn=document.getElementById("tmWarn");
  if(!nm){ warn.textContent="Give the tile a name."; return; }
  if(TERRAINS.length>=40){ warn.textContent="That is as many tiles as a sheet can hold."; return; }
  const id="cu_"+Date.now().toString(36);
  S.custom.push({id, name:nm, base:tmColor, sym:"none",
                 svg:tmSvg, svgName:tmSvgName, keepColour:tmKeepColour});
  if(tmSvg) loadTileSvg(id, tmSvg, ()=>{ buildTileSwatches(); refresh(); });
  rebuildTiles(); buildTileSwatches();
  curT=id;
  [...terrBox.children].forEach((x,n)=>x.setAttribute("aria-pressed",TERRAINS[n].id===curT));
  tileModal.classList.remove("on");
  setTool("paint"); refresh(); store();
};
function deleteCustom(id){
  const v=T_BY_ID[id];
  if(v) for(let i=0;i<S.terr.length;i++) if(S.terr[i]===v) S.terr[i]=0;
  S.custom=S.custom.filter(t=>t.id!==id);
  rebuildTiles(); buildTileSwatches(); refresh(); store();
}

/* ══════════════ notes page ══════════════ */
function buildNotesPage(){
  const body=document.getElementById("notesBody");
  if(!body) return;
  body.innerHTML="";
  const keys=Object.keys(S.memo).filter(k=>S.memo[k]);
  if(!keys.length){
    const p=document.createElement("p");
    p.style.cssText="color:var(--dimmer);font:400 15px/1.6 'IBM Plex Mono',monospace;grid-column:1/-1";
    p.textContent="No notes yet. Use the Inspect tool to annotate hexes.";
    body.appendChild(p); return;
  }
  keys.sort((a,b)=>+a-+b).forEach(k=>{
    const i=+k, col=i%S.cols, r=(i-col)/S.cols;
    if(!inside(col,r)) return;
    const gc=gridCoord(col,r);
    const t=S.terr[i], f=S.feat[i];
    const tName=t?TERRAINS[t-1].name:"—", fName=f?FEATURES[f-1].name:"";
    const nm=S.labels[i]||"";
    const card=document.createElement("div");
    card.style.cssText="background:var(--panel);border:1px solid var(--edge);border-radius:6px;"
      +"padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s";
    const title=document.createElement("div");
    title.style.cssText="display:flex;align-items:baseline;gap:12px";
    const gcSpan=document.createElement("span"); gcSpan.style.cssText="font:600 18px/1 'IBM Plex Mono',monospace;color:var(--text)"; gcSpan.textContent=gc; title.appendChild(gcSpan);
    if(nm){ const nmSpan=document.createElement("span"); nmSpan.style.cssText="font:500 13px/1 'Archivo',sans-serif;color:var(--dim)"; nmSpan.textContent=nm; title.appendChild(nmSpan); }
    const sub=document.createElement("div");
    sub.style.cssText="font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase";
    sub.textContent=tName+(fName?" · "+fName:"");
    const txt=document.createElement("div");
    txt.style.cssText="font:400 14px/1.7 'Archivo',sans-serif;color:var(--text);white-space:pre-wrap";
    txt.textContent=S.memo[i];
    card.appendChild(title); card.appendChild(sub); card.appendChild(txt);
    card.addEventListener("click",()=>{ sel=i; closePage(); openInspector(); });
    card.addEventListener("mouseenter",()=>{ card.style.borderColor="var(--accent)"; });
    card.addEventListener("mouseleave",()=>{ card.style.borderColor="var(--edge)"; });
    body.appendChild(card);
  });
}
const notesPage=document.getElementById("notesPage");
function openPage(){ buildNotesPage(); notesPage.style.display="flex"; }
function closePage(){ notesPage.style.display="none"; }
document.getElementById("notesClose").onclick=closePage;
document.getElementById("notesBtn").onclick=openPage;

/* ══════════════ session storage ══════════════ */
const KEY="hexlore:plate", OLD_KEY="hexsurvey:plate";
let saveTmr=null;
function store(){
  if(!window.storage) return;
  clearTimeout(saveTmr);
  saveTmr=setTimeout(()=>{ try{ window.storage.set(KEY,serialise()); }catch(e){} },700);
}
function randName(){
  const adj=["Ashen","Crimson","Iron","Silent","Hollow","Sunken","Broken","Grey",
              "Ancient","Blighted","Faded","Bitter","Wandering","Forsaken","Dark",
              "Scarred","Lost","Pale","Storm","Ember"];
  const noun=["Reach","Vale","Moor","Crossing","Expanse","Waste","Fen","Marches",
               "Shore","Downs","Pass","Hold","Hollow","Basin","Heath","Strand",
               "Peaks","Crown","Gate","Brink"];
  const prefix=["The ","The ","","","The ",""];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  return pick(prefix)+pick(adj)+" "+pick(noun);
}
async function boot(){
  if(!S.title){ S.title=randName(); }
  syncRail();
  if(window.storage){
    try{
      let r=null;
      try{ r=await window.storage.get(KEY); }
      catch(e){ /* nothing under the current key */ }
      if(!r||!r.value){
        // carry over anything saved before the rename
        try{ r=await window.storage.get(OLD_KEY); }catch(e){}
      }
      if(r&&r.value){ hydrate(JSON.parse(r.value)); syncRail(); }
    }catch(e){ /* nothing stored yet */ }
  }
  try{ await document.fonts.ready; }catch(e){}
  ppmView=fitPpm(); showZoom();
  refresh();
}

/* ══════════════ keys ══════════════ */
addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"){
    if(e.key==="Escape"){
      e.target.blur();
      if(insp.classList.contains("on")) closeInspector();
    }
    return;
  }
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.metaKey||e.ctrlKey)&&k==="y"){ e.preventDefault(); redo(); return; }
  if(e.metaKey||e.ctrlKey) return;
  const map={b:"paint",g:"fill",f:"feature",e:"erase",i:"inspect"};
  if(map[k]) setTool(map[k]);
  if(k==="c"){ S.coord=!S.coord; document.getElementById("cCoord").checked=S.coord; refresh(); store(); }
  if(k==="n"&&!insp.classList.contains("on")) openPage();
  if(k==="escape") closeInspector();
  if(k==="+"||k==="="){ setZoom(ppmView*1.25,true); }
  if(k==="-"||k==="_"){ setZoom(ppmView/1.25,true); }
  if(k==="0"){ doFit(); }
  if(k==="["&&brush>0){ brushI.value=--brush; brushI.oninput(); }
  if(k==="]"&&brush<2){ brushI.value=++brush; brushI.oninput(); }
});

boot();
</script>
