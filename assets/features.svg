<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Hexlore built-in POI sprite.
    Each <symbol> uses a 100×100 viewBox; the centre of the icon is at (50,50).
    Edit this file in Inkscape / Figma / any SVG tool, then run:
        node update-sprite.js
    to patch the inline sprite in index.html and see the changes immediately.
    Rules:
      • Use fill="black" / stroke="black" — the renderer tints everything to INK.
      • Transparent areas stay transparent (don't use white fills for cut-outs;
        use fill-rule="evenodd" compound paths instead).
      • Keep icons centred at (50,50) with comfortable padding inside the viewBox.
  -->

  <!-- Town: solid circle -->
  <symbol id="town" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="21"/>
  </symbol>

  <!-- City: inner circle + outer ring -->
  <symbol id="city" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="21"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="black" stroke-width="7"/>
  </symbol>

  <!-- Capitol: outer ring + filled 5-pointed star -->
  <symbol id="capitol" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="36" fill="none" stroke="black" stroke-width="6"/>
    <polygon points="50,24 56.5,41 74.7,42 60.5,53.4 65.3,71 50,61 34.7,71 39.5,53.4 25.3,42 43.5,41"/>
  </symbol>

  <!-- Castle/Keep: open square outline -->
  <symbol id="keep" viewBox="0 0 100 100">
    <rect x="29" y="29" width="42" height="42" fill="none" stroke="black" stroke-width="8" stroke-linejoin="miter"/>
  </symbol>

  <!-- Tower: crenellated tower with arched window -->
  <symbol id="tower" viewBox="0 0 100 100">
    <path fill-rule="evenodd" d="
      M32,18 H41 V24 H46 V18 H54 V24 H59 V18 H68 V32 H64 V82 H36 V32 H32 Z
      M45,58 V49 A5,5 0 0 1 55,49 V58 Z
    "/>
  </symbol>

  <!-- Ruins: filled square -->
  <symbol id="ruin" viewBox="0 0 100 100">
    <rect x="29" y="29" width="42" height="42"/>
  </symbol>

  <!-- Cave: craggy rock with cave mouth cut-out -->
  <symbol id="cave" viewBox="0 0 100 100">
    <path fill-rule="evenodd" d="
      M8,76 L16,58 L25,51 L29,39 L40,30 L48,33 L56,22 L67,29 L73,41 L81,47 L88,61 L92,76 Z
      M35,76 C34,67 37,60 41,56 L45,59 L49,52 L54,56 L59,53 C64,59 66,67 65,76 Z
    "/>
  </symbol>

  <!-- Temple: pediment + columns + stylobate -->
  <symbol id="temple" viewBox="0 0 100 100">
    <polygon points="12,45 50,21 88,45"/>
    <rect x="30.5" y="46" width="9"  height="24"/>
    <rect x="45.5" y="46" width="9"  height="24"/>
    <rect x="60.5" y="46" width="9"  height="24"/>
    <rect x="16"   y="70" width="68" height="8"/>
  </symbol>

  <!-- Camp: campfire, flame over crossed logs -->
  <symbol id="camp" viewBox="0 0 100 100">
    <path fill-rule="evenodd" d="
      M50,14 C58,26 70,36 70,52 C70,64 61,72 50,72 C39,72 30,64 30,52 C30,42 36,36 40,30 C40,38 43,43 47,44 C45,34 46,24 50,14 Z
      M50,68 C44,68 40,63 40,57 C40,50 46,46 50,38 C54,46 60,50 60,57 C60,63 56,68 50,68 Z
    "/>
    <line x1="24" y1="86" x2="76" y2="72" stroke="black" stroke-width="7" stroke-linecap="round"/>
    <line x1="76" y1="86" x2="24" y2="72" stroke="black" stroke-width="7" stroke-linecap="round"/>
  </symbol>

  <!-- Bridge: humped single stone arch -->
  <symbol id="bridge" viewBox="0 0 100 100">
    <path d="M10,65 V51 Q50,19 90,51 V65 H74 A24,20 0 0 0 26,65 Z"/>
  </symbol>

  <!-- Harbour: mast + boom + sail arc -->
  <symbol id="port" viewBox="0 0 100 100">
    <circle cx="50" cy="26" r="7.5" fill="none" stroke="black" stroke-width="7.5"/>
    <line x1="50" y1="34" x2="50" y2="77" stroke="black" stroke-width="7.5" stroke-linecap="round"/>
    <line x1="34" y1="43" x2="66" y2="43" stroke="black" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M26,58 Q50,92 74,58" fill="none" stroke="black" stroke-width="7.5" stroke-linecap="round"/>
  </symbol>

  <!-- Mine: crossed picks -->
  <symbol id="mine" viewBox="0 0 100 100">
    <line x1="26" y1="75" x2="74" y2="30" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <line x1="74" y1="75" x2="26" y2="30" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <path d="M18,36 Q29,20 42,26" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
    <path d="M82,36 Q71,20 58,26" fill="none" stroke="black" stroke-width="8" stroke-linecap="round"/>
  </symbol>

  <!-- Battle: crossed swords with guards -->
  <symbol id="battle" viewBox="0 0 100 100">
    <line x1="23" y1="77" x2="74" y2="25" stroke="black" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="77" y1="77" x2="26" y2="25" stroke="black" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="41" y2="80" stroke="black" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="80" y1="60" x2="59" y2="80" stroke="black" stroke-width="5.5" stroke-linecap="round"/>
  </symbol>

  <!-- Landmark: 8-pointed star -->
  <symbol id="mark" viewBox="0 0 100 100">
    <polygon points="50,19 58.5,41.5 81,50 58.5,58.5 50,81 41.5,58.5 19,50 41.5,41.5"/>
  </symbol>

</svg>
